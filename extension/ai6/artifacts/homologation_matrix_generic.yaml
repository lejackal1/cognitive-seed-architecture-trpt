# AI6 Homologation Matrix — profile: generic (dominio-agnóstico)

version: "1.0.0"
profile: generic
confidence_threshold_m4: 0.75

exclusions:
  - "modo simple"
  - "respuesta corta"
  - "sin analisis"
  - "sin análisis"
  - "solo chatea"

intents:
  RESEARCH:
    lemmas:
      - investigar
      - investiga
      - estudiar
      - estudia
      - explorar
      - explora
      - revisar
      - revisa
    mode: RESEARCH
    tokens:
      - "@FLOW:START"
      - "@PROFILE:generic"
      - "@MODE:RESEARCH"
      - "@VALIDATION:STRICT"
      - "@MEMORY:LOAD"
      - "@DECISION:CONTROLLED"
      - "@LEDGER:RECORD"
    body_template: "Investigar {module}"

  ANALYZE:
    lemmas:
      - analizar
      - analiza
      - comparar
      - compara
      - evaluar
      - evalua
    mode: ANALYZE
    tokens:
      - "@FLOW:START"
      - "@PROFILE:generic"
      - "@MODE:ANALYZE"
      - "@VALIDATION:STRICT"
      - "@MEMORY:LOAD"
      - "@LEDGER:RECORD"
    body_template: "Analizar {module}"

  DOCUMENT:
    lemmas:
      - documentar
      - documenta
      - redactar
      - redacta
      - escribir informe
      - escribe informe
    mode: DOCUMENT
    extends: RESEARCH
    body_template: "Documentar {module}"

  VERIFY:
    lemmas:
      - verificar
      - verifica
      - validar
      - valida
      - comprobar
      - comprueba
    mode: ORCHESTRATE
    tokens:
      - "@FLOW:START"
      - "@PROFILE:generic"
      - "@MODE:ORCHESTRATE"
      - "@VALIDATION:STRICT"
      - "@LEDGER:RECORD"
    body_template: "Verificar {module}"

  BUILD:
    lemmas:
      - construir
      - construye
      - crear
      - crea
      - generar
      - genera
      - disenar
      - diseña
    mode: BUILD
    tokens:
      - "@FLOW:START"
      - "@PROFILE:generic"
      - "@MODE:BUILD"
      - "@VALIDATION:STRICT"
      - "@LEDGER:RECORD"
    body_template: "Construir {module}"

  LEARN:
    lemmas:
      - aprender
      - aprende
      - sintetizar
      - sintetiza
      - resumir
      - resume
    mode: LEARN
    tokens:
      - "@FLOW:START"
      - "@PROFILE:generic"
      - "@MODE:LEARN"
      - "@MEMORY:INTEGRATE"
      - "@LEDGER:RECORD"
    body_template: "Aprender sobre {module}"

  QUERY:
    lemmas:
      - que es
      - qué es
      - consultar
      - consulta
      - explicar
      - explica
    mode: ORCHESTRATE
    tokens:
      - "@FLOW:START"
      - "@PROFILE:generic"
      - "@MODE:ORCHESTRATE"
      - "@LEDGER:RECORD"
    body_template: "Consultar {module}"

entity_extraction:
  module:
    patterns:
      - "tema {name}"
      - "tema {name}"
      - "sobre {name}"
      - "modulo {name}"
      - "módulo {name}"
      - "dominio {name}"
  process:
    patterns:
      - "proceso {name}"

embedding:
  enabled: false
  weight: 0.4
  exemplars:
    RESEARCH:
      - indagar tema
      - profundizar en tema
      - examinar dominio
    ANALYZE:
      - contrastar enfoques
      - examinar datos
    DOCUMENT:
      - elaborar informe
      - producir especificacion
    VERIFY:
      - corroborar hipotesis
      - contrastar resultados
    BUILD:
      - implementar prototipo
      - desarrollar plan
    LEARN:
      - absorber conocimiento
      - recopilar literatura

defaults:
  validation: STRICT
  decision: CONTROLLED
