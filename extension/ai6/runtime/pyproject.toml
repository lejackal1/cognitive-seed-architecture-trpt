[project]
name = "ai6-runtime"
version = "0.1.0"
description = "AI6 cognitive runtime — DSL parser, kernel, multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]
watch = ["watchdog>=3.0"]
vectors = ["chromadb>=0.4"]
llm = ["httpx>=0.26"]

[project.scripts]
ai6 = "ai6.cli:main"

[tool.setuptools.packages.find]
include = ["ai6*"]
exclude = ["tests*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
